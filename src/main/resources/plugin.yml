name: HungerGames
main: com.herocraft.hungergames.HungerGamesPlugin
version: 1.1.0
api-version: '1.21'
author: zzaee
description: Hunger Games "battle royale" avec zones jamais reutilisees sur un monde normal.

commands:
  hg:
    description: Commandes joueur du Hunger Games
    usage: /hg <join|leave|kit|arenas|unspectate>
  hgadmin:
    description: Commandes admin du Hunger Games
    usage: /hgadmin <...>
    permission: hungergames.admin

permissions:
  hungergames.admin:
    description: Acces aux commandes admin du Hunger Games
    default: op
  hungergames.play:
    description: Autorise a rejoindre une partie
    default: true
