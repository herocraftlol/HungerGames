name: HungerGames
main: com.herocraft.hungergames.HungerGamesPlugin
version: 1.11.0
api-version: '1.21'
author: zzaee
description: Hunger Games "battle royale à l'ancienne" pour Paper 1.21 — spawns dispersés sur une vraie map générée, arènes persistantes qui tournent en boucle avec un pool de ~10 000 cellules autour du hub, bordure vraiment fiable et progressive avec dégâts manuels et repaint continu pour compenser le bug Paper, morts invisibles et silencieux avec boussole de suivi, lobby d'attente entièrement retiré au lancement, XP remise à zéro, kill-feed, GUI d'arènes dynamique avec état en temps réel, tableau des scores persistant, lobby central procédural et kits configurables.

commands:
  hg:
    description: Commandes joueur du Hunger Games
    usage: /hg <join|leave|kit|arenas|unspectate>
  hgadmin:
    description: Commandes admin du Hunger Games
    usage: /hgadmin <zone|kit|reload|list>
    permission: hungergames.admin

permissions:
  hungergames.admin:
    description: Acces aux commandes admin du Hunger Games
    default: op
  hungergames.play:
    description: Autorise a rejoindre une partie
    default: true
