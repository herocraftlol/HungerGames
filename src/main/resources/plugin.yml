name: HungerGames
main: com.herocraft.hungergames.HungerGamesPlugin
version: 1.8.0
api-version: '1.21'
author: zzaee
description: Plugin battle royale pour Paper 1.21 — un monde Bukkit dédié par arène avec vraie bordure vanilla, morts invisibles et silencieux, lobby d'attente retiré au lancement, XP à zéro, arènes persistantes, kill-feed, scoreboard, spectateur, GUI d'arènes dynamique et lobby procédural.

commands:
  hg:
    description: Commandes joueur du Hunger Games
    usage: /hg <join|leave|kit|arenas|unspectate>
  hgadmin:
    description: Commandes admin du Hunger Games
    usage: /hgadmin <zone|kit|reload|list>
    permission: hungergames.admin

permissions:
  hungergames.admin:
    description: Acces aux commandes admin du Hunger Games
    default: op
  hungergames.play:
    description: Autorise a rejoindre une partie
    default: true
