name: HungerGames
main: com.herocraft.hungergames.HungerGamesPlugin
version: 1.10.0
api-version: '1.21'
author: zzaee
description: Hunger Games "battle royale" à l'ancienne pour Paper 1.21 — zones jamais réutilisées sur un monde normal, arènes persistantes, bordure vraiment fiable et progressive avec dégâts manuels, morts invisibles et silencieux avec boussole de suivi, lobby d'attente retiré au lancement, XP remise à zéro, kill-feed, GUI d'arènes dynamique, tableau des scores persistant, lobby central procédural.

commands:
  hg:
    description: Commandes joueur du Hunger Games
    usage: /hg <join|leave|kit|arenas|unspectate>
  hgadmin:
    description: Commandes admin du Hunger Games
    usage: /hgadmin <zone|kit|reload|list>
    permission: hungergames.admin

permissions:
  hungergames.admin:
    description: Acces aux commandes admin du Hunger Games
    default: op
  hungergames.play:
    description: Autorise a rejoindre une partie
    default: true
