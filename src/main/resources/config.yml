# Monde partagé où vit le HUB (spawn/lobby central). Les arènes, elles, vivent
# chacune dans leur propre monde Bukkit dédié, créé/supprimé automatiquement
# (voir la section "arena-worlds" plus bas) — ce réglage ne concerne QUE le hub.
world: world

# Point de retour des joueurs quand ils ne sont pas en partie (hub).
# Le hub est une zone bornée entre -100 et 100 en X et en Z (voir hub.radius) :
# construis ton lobby/spawn à l'intérieur de ces limites, une bordure de monde
# personnelle y est automatiquement appliquée à chaque joueur qui y est envoyé.
hub:
  x: 0.5
  y: 100
  z: 0.5
  radius: 100
  # Réglages utilisés par /hgadmin hub build pour construire le lobby procéduralement.
  build:
    # Rayon (en blocs) de la zone construite/décorée autour du spawn. Doit rester
    # inférieur à hub.radius - 5 (sinon il est automatiquement réduit).
    radius: 40
    # Nombre de pupitres de PNJ "rejoindre une arène" en face du spawn (1 à 7).
    npc-count: 1
    # Distance (en blocs) entre le spawn et la rangée de PNJ.
    npc-distance: 18

# Chaque arène vit dans son propre monde Bukkit dédié (créé dynamiquement à
# côté du dossier du hub, sur le disque du serveur), pour bénéficier de la
# VRAIE bordure de monde vanilla (animée et infligeant ses dégâts nativement,
# fiable) au lieu d'une bordure virtuelle par-joueur. Voir le README pour le
# détail de cette architecture et ses implications (espace disque, temps de
# création d'un monde...).
arena-worlds:
  # Préfixe du nom de dossier des mondes d'arène générés
  # (ex. "hg_arena_a1b2c3d4"). Change-le si "hg_arena_" entre déjà en conflit
  # avec un monde existant sur ton serveur.
  arena-name-prefix: "hg_arena_"

zone:
  # Taille (diametre) d'une zone en blocs, choisie par un administrateur via
  # /hgadmin zone create <nom> (1000 => rayon 500 depuis le centre de son monde).
  # Toutes les zones créées partagent cette même taille.
  size: 1000
  # Marge de securite a l'interieur de la bordure pour le scatter des joueurs (evite de spawn collé au bord).
  scatter-margin: 40
  # Nombre de chunks charges/generes par tick pendant le prechargement d'une zone
  # (nouveau monde d'arène) ou de la zone du hub.
  chunks-per-tick: 8
  # Nombre de chunks régénérés par tick pour la zone construite du HUB
  # (/hgadmin hub delete uniquement — les arènes, elles, suppriment tout leur
  # monde d'un coup au lieu de régénérer chunk par chunk, voir WorldAllocator).
  regen-chunks-per-tick: 2

lobby:
  # Hauteur (Y) de la plateforme flottante de lobby, au centre du monde de chaque arène.
  y: 200
  radius: 8
  # Marge (en blocs) entre le bord de la plateforme et la cage de blocs barrière
  # qui empêche d'en tomber/sortir pendant l'attente. Retirée au lancement de la partie.
  cage-margin: 3
  # Hauteur (en blocs) des murs de la cage, au-dessus du niveau de la plateforme.
  cage-height: 5

game:
  min-players: 2
  max-players: 100
  countdown-seconds: 30
  # Duree pendant laquelle le PVP est desactive apres le scatter (farm autorise).
  grace-period-seconds: 300
  # Duree (secondes) entre la victoire (dernier survivant) et le retour automatique
  # de tout le monde au hub. Le vainqueur reste en jeu, les autres sont/restent
  # spectateurs pendant ce délai.
  end-delay-seconds: 10
  scatter:
    min-distance-between-players: 20
  border:
    shrink:
      enabled: true
      # Ne commence a retrecir qu'apres la fin de la periode de grace (debut du PVP).
      # Phase 1 : premiere reduction, comme avant.
      phase1:
        target-diameter: 150
        duration-seconds: 900
      # Pause entre les deux phases (aucune reduction pendant ce temps).
      pause-seconds: 300
      # Phase 2 : reduction finale jusqu'au centre de la zone.
      phase2:
        target-diameter: 10
        duration-seconds: 600

storage:
  kits-file: kits.yml
  # Fichier où sont sauvegardées les victoires de chaque joueur (tableau des scores, /hg top).
  stats-file: stats.yml
